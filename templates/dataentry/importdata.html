{% extends "base.html" %}
{% block title %}Import Data Page{% endblock %}
{% block content %}
<!-- Bootstrap Icons (add this to base.html <head> if not already included) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
    .hero-title {
        font-weight: 700;
        background: linear-gradient(90deg, #4e54c8, #8f94fb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .form-card {
        border: none;
        border-radius: 1rem;
        overflow: hidden;
        max-width: 600px;
        margin: 0 auto;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2) !important;
    }

    .form-card-header {
        background: linear-gradient(135deg, #4e54c8, #8f94fb);
        color: #fff;
        padding: 2rem;
        text-align: center;
    }

    .form-card-header .icon-wrap {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin: 0 auto 1rem;
        color: #fff;
    }

    .form-card-body {
        padding: 2rem;
        background: #fff;
    }

    .form-control {
        border-radius: 0.5rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid #dee2e6;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .form-control:focus {
        border-color: #8f94fb;
        box-shadow: 0 0 0 0.2rem rgba(78, 84, 200, 0.25);
    }

    .form-label {
        font-weight: 600;
        color: #343a40;
        margin-bottom: 0.4rem;
    }

    .btn-glow {
        background: linear-gradient(135deg, #4e54c8, #8f94fb);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 0.65rem 1.5rem;
        border-radius: 0.5rem;
        transition: all 0.25s ease;
    }

    .btn-glow:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(78, 84, 200, 0.35);
        color: #fff;
    }
</style>

<div class="container mt-5" style="padding: 50px;">
    <div class="card form-card shadow">
        <div class="form-card-header">
            <div class="icon-wrap">
                <i class="bi bi-upload"></i>
            </div>
            <h3 class="mb-0">Import Data To Database Tables</h3>
            <p class="mb-0 mt-1" style="opacity: 0.9;">Upload a CSV file and map it to a table</p>
        </div>

        <div class="form-card-body">
            <form action="{% url 'import_data' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="file_path" class="form-label">
                        <i class="bi bi-file-earmark-spreadsheet me-1"></i> Upload CSV File
                    </label>
                    <input type="file" name="file_path" id="file_path" class="form-control" required>
                </div>

                <div class="form-group mb-4">
                    <label for="model_name" class="form-label">
                        <i class="bi bi-database me-1"></i> Select Database
                    </label>
                    <select name="model_name" id="model_name" class="form-control" required>
                        <option value="" disabled selected>Select</option>
                        {% for model in custom_models %}
                            <option value="{{ model }}">{{ model }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group d-grid">
                    <input type="submit" value="Import Data" class="btn btn-glow">
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
