{% extends "base.html" %}

{% block title %}Registration Page{% endblock %}

{% block content %}
{% load crispy_forms_tags %}

<style>
    .form-card {
        border: none;
        border-radius: 1rem;
        overflow: hidden;
        max-width: 600px;
        margin: 0 auto;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2) !important;
    }

    .form-card-header {
        background: linear-gradient(135deg, #11998e, #38ef7d);
        color: #fff;
        padding: 2rem;
        text-align: center;
    }

    .form-card-header .icon-wrap {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin: 0 auto 1rem;
        color: #fff;
    }

    .form-card-body {
        padding: 2rem;
        background: #fff;
    }

    .form-card-body input.form-control,
    .form-card-body select.form-control {
        border-radius: 0.5rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid #dee2e6;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .form-card-body input.form-control:focus,
    .form-card-body select.form-control:focus {
        border-color: #38ef7d;
        box-shadow: 0 0 0 0.2rem rgba(17, 153, 142, 0.25);
    }

    .form-card-body label {
        font-weight: 600;
        color: #343a40;
        margin-bottom: 0.4rem;
    }

    .btn-glow {
        background: linear-gradient(135deg, #11998e, #38ef7d);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 0.65rem 1.5rem;
        border-radius: 0.5rem;
        transition: all 0.25s ease;
    }

    .btn-glow:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(17, 153, 142, 0.35);
        color: #fff;
    }

    .form-footer-link {
        text-align: center;
        margin-top: 1rem;
        color: #6c757d;
    }

    .form-footer-link a {
        color: #4e54c8;
        font-weight: 600;
        text-decoration: none;
    }

    .form-footer-link a:hover {
        color: #ff6a00;
        text-decoration: underline;
    }
</style>

<div class="container mt-5" style="padding: 50px;">
    <div class="card form-card shadow">
        <div class="form-card-header">
            <div class="icon-wrap">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2 class="mb-0">Register</h2>
            <p class="mb-0 mt-1" style="opacity: 0.9;">Create an account to get started</p>
        </div>

        <div class="form-card-body">
            <form action="{% url 'register' %}" method="POST">
                {% csrf_token %}

                <div class="form-group mb-4">
                    {{ form | crispy }}
                </div>

                <div class="form-group d-grid">
                    <input type="submit" value="Register" class="btn btn-glow">
                </div>
            </form>


            <div class="form-footer-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
