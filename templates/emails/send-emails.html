{% extends "base.html" %}

{% block title %}Send Emails{% endblock %}

{% block content %}
{% load crispy_forms_tags %}

<!-- Bootstrap Icons (add this to base.html <head> if not already included) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
    .form-card {
        border: none;
        border-radius: 1rem;
        overflow: hidden;
        max-width: 600px;
        margin: 0 auto;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2) !important;
    }

    .form-card-header {
        background: linear-gradient(135deg, #ee0979, #ff6a00);
        color: #fff;
        padding: 2rem;
        text-align: center;
    }

    .form-card-header .icon-wrap {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin: 0 auto 1rem;
        color: #fff;
    }

    .form-card-body {
        padding: 2rem;
        background: #fff;
    }

    .form-card-body input.form-control,
    .form-card-body textarea.form-control,
    .form-card-body select.form-control {
        border-radius: 0.5rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid #dee2e6;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .form-card-body input.form-control:focus,
    .form-card-body textarea.form-control:focus,
    .form-card-body select.form-control:focus {
        border-color: #ff6a00;
        box-shadow: 0 0 0 0.2rem rgba(238, 9, 121, 0.25);
    }

    .form-card-body label {
        font-weight: 600;
        color: #343a40;
        margin-bottom: 0.4rem;
    }

    .btn-glow {
        background: linear-gradient(135deg, #ee0979, #ff6a00);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 0.65rem 1.5rem;
        border-radius: 0.5rem;
        transition: all 0.25s ease;
    }

    .btn-glow:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(238, 9, 121, 0.35);
        color: #fff;
    }
</style>

<div class="container mt-5" style="padding: 50px;">
    <div class="card form-card shadow">
        <div class="form-card-header">
            <div class="icon-wrap">
                <i class="bi bi-envelope-paper"></i>
            </div>
            <h2 class="mb-0">Compose an Email</h2>
            <p class="mb-0 mt-1" style="opacity: 0.9;">Send bulk emails to your users</p>
        </div>

        <div class="form-card-body">
            <form action="{% url 'send_email' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group mb-4">
                    {{ email_form | crispy }}
                </div>

                <div class="form-group d-grid">
                    <input type="submit" value="Send" class="btn btn-glow">
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
